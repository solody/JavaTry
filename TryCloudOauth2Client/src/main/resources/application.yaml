spring:
  application:
    name: oauth2-client
  cloud:
    nacos:
      username: nacos
      password: 123
      discovery:
        server-addr: nacos-server:8848
        fail-fast: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Must match JWT iss (public URL via Gateway / forward-headers)
          issuer-uri: http://authorization-server:8080
          # Fetch keys over Docker network (avoid discovery hitting public Host from inside the container)
          jwk-set-uri: http://authorization-server:8080/oauth2/jwks
      client:
        registration:
          oidc-client:
            provider: my-oidc-provider
            client-id: oidc-client
            client-secret: secret
            authorization-grant-type: authorization_code
            scope: openid,profile
          token-exchange-client:
            provider: my-oidc-provider
            client-id: oidc-client
            client-secret: secret
            authorization-grant-type: urn:ietf:params:oauth:grant-type:token-exchange
            scope: openid,profile
        provider:
          my-oidc-provider:
            issuer-uri: http://authorization-server:8080
            # Browser redirects (public DNS via Gateway)
            authorization-uri: http://authorization-server.solody.com/oauth2/authorize
            # Server-to-server (Docker network). OIDC UserInfo is /userinfo, not /oauth2/userinfo.
            token-uri: http://authorization-server:8080/oauth2/token
            jwk-set-uri: http://authorization-server:8080/oauth2/jwks
            user-info-uri: http://authorization-server:8080/userinfo
            # end_session_endpoint has no YAML property; overridden in SecurityConfig
            # to http://authorization-server.solody.com/connect/logout
server:
  port: 8091
  servlet:
    session:
      # Avoid colliding with the Authorization Server's JSESSIONID on localhost
      # (cookie domain is host-only; ports are ignored).
      cookie:
        name: OAUTH2_CLIENT_SESSION