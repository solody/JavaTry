spring:
  application:
    name: TryCloudOauth2Login
  security:
    oauth2:
      client:
        registration:
          my-oidc-client:
            provider: my-oidc-provider
            client-id: oidc-client
            client-secret: secret
            authorization-grant-type: authorization_code
            scope: openid,profile
        provider:
          my-oidc-provider:
            issuer-uri: http://localhost:8080
server:
  port: 8090
  servlet:
    session:
      # Avoid colliding with the Authorization Server's JSESSIONID on localhost
      # (cookie domain is host-only; ports are ignored).
      cookie:
        name: OAUTH2_LOGIN_SESSION